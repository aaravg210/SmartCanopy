version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: smartcanopy-postgres
    environment:
      POSTGRES_DB: smartcanopy
      POSTGRES_USER: smartcanopy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcanopy_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcanopy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcanopy-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartcanopy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smartcanopy-network

  # pgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartcanopy-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartcanopy.local
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD:-smartcanopy_dev_password}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - smartcanopy-network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

  # Redis Commander (optional - for Redis management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: smartcanopy-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - smartcanopy-network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  smartcanopy-network:
    driver: bridge
