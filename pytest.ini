[pytest]
# Pytest configuration for SmartCanopy AI

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    -l
    # Capture output (show print statements on failure)
    --capture=no
    # Color output
    --color=yes
    # Show durations of slowest tests
    --durations=10
    # Strict markers
    --strict-markers
    # Coverage (optional - uncomment to enable)
    # --cov=agent
    # --cov=api
    # --cov-report=html
    # --cov-report=term-missing

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    e2e: End-to-end user journey tests
    performance: Performance and scalability tests
    slow: Tests that take a long time to run
    requires_api_key: Tests that require Claude API key
    requires_gee: Tests that require Google Earth Engine
    requires_redis: Tests that require Redis connection

# Asyncio mode
asyncio_mode = auto

# Timeout for tests (in seconds)
timeout = 300

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
